server.port=8083
spring.application.name=user-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cricket_users}
spring.datasource.username=${DB_USER:cricket}
spring.datasource.password=${DB_PASSWORD:cricket}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:this-is-a-local-dev-only-secret-key-change-me-32chars+}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

management.endpoints.web.exposure.include=health,info

springdoc.swagger-ui.path=/swagger-ui.html