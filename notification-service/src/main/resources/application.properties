# ===== Server =====
server.port=8085

spring.application.name=notification-service

# ===== Datasource (Postgres) =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cricket_notifications}
spring.datasource.username=${DB_USER:cricket}
spring.datasource.password=${DB_PASSWORD:cricket}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest

# ===== JWT (validation only) =====
jwt.secret=${JWT_SECRET:this-is-a-local-dev-only-secret-key-change-me-32chars+}

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
