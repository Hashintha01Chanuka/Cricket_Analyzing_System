server.port=8082
spring.application.name=player-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cricket_players}
spring.datasource.username=${DB_USER:cricket}
spring.datasource.password=${DB_PASSWORD:cricket}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info

springdoc.swagger-ui.path=/swagger-ui.html



