server.port=8084
spring.application.name=stats-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cricket_stats}
spring.datasource.username=${DB_USER:cricket}
spring.datasource.password=${DB_PASSWORD:cricket}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== Downstream service (temporary sync REST call, see MatchServiceClient) =====
match-service.base-url=${MATCH_SERVICE_URL:http://localhost:8081}

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=stats-service-group
spring.kafka.consumer.auto-offset-reset=earliest

# ===== JWT (validation only) =====
jwt.secret=${JWT_SECRET:this-is-a-local-dev-only-secret-key-change-me-32chars+}

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
