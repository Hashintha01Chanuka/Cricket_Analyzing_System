server.port=8081
spring.application.name=match-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cricket_matches}
spring.datasource.username=${DB_USER:cricket}
spring.datasource.password=${DB_PASSWORD:cricket}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ===== JWT (validation only ? this service never issues tokens) =====
# MUST match User Service's jwt.secret exactly, since it verifies the same
# signed tokens. Local-dev-only default; override via env var in real use.
jwt.secret=${JWT_SECRET:this-is-a-local-dev-only-secret-key-change-me-32chars+}

springdoc.swagger-ui.path=/swagger-ui.html
