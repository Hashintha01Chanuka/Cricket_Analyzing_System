server.port=8080
spring.application.name=api-gateway

spring.cloud.gateway.routes[0].id=match-service
spring.cloud.gateway.routes[0].uri=${MATCH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/matches/**

spring.cloud.gateway.routes[1].id=player-service
spring.cloud.gateway.routes[1].uri=${PLAYER_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/players/**

spring.cloud.gateway.routes[2].id=user-service-auth
spring.cloud.gateway.routes[2].uri=${USER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[3].id=user-service-users
spring.cloud.gateway.routes[3].uri=${USER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.routes[4].id=stats-service
spring.cloud.gateway.routes[4].uri=${STATS_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/stats/**

spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/notifications/**

# for monitoring,debugging the application, expose endpoints
management.endpoints.web.exposure.include=health,info,gateway