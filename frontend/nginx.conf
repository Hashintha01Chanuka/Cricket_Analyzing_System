server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real file (e.g. /matches/abc-123,
    # a React Router route) falls back to index.html so React Router can
    # handle it client-side, instead of nginx returning a 404 for a route
    # that only exists in JavaScript.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets; index.html itself is not
    # cached so a new deployment is picked up on next visit without users
    # needing a hard refresh.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
